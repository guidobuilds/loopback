# Alembic config for the loopback service.
#
# Run from the `service/` directory so `app` is importable
# (prepend_sys_path = .). The DB URL is NOT set here; env.py derives it from the
# DB_PATH environment variable (default /tmp/loopback.db) to match the app.
#
#   cd service && DB_PATH=/data/loopback.db alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
